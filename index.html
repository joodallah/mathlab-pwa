<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2859a5">
  <meta name="description" content="معمل الرياضيات الافتراضي للصفوف الابتدائية">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/mathlab-192.svg" type="image/svg+xml">
  <title>معمل الرياضيات الافتراضي</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{font-family:Calibri,"Segoe UI",Arial,sans-serif;background:#f5f8ff;color:#17365f}.shell{height:100%;min-height:100svh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;box-shadow:0 2px 12px #17365f18;z-index:1}.top img{width:40px;height:40px}.title{font-weight:700;font-size:18px}.open{margin-inline-start:auto;color:#2859a5;font-weight:700;text-decoration:none;padding:10px 14px;border-radius:12px;background:#edf4ff;white-space:nowrap}.frame{position:relative;min-height:0}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f5f8ff}.message{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#f5f8ff;z-index:-1}.message p{max-width:520px;line-height:1.7}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <img src="./icons/mathlab-192.svg" alt="">
      <div class="title">معمل الرياضيات الافتراضي</div>
      <a class="open" href="https://script.google.com/macros/s/AKfycbyDqH4jgiuWpD0om-WUSPr24_Nr9fJGI7w2jOOihfuVRbomCDFCdLKvZ7a7Gs5_xCiN/exec" target="_blank" rel="noopener">فتح المعمل مباشرة</a>
    </header>
    <section class="frame" aria-label="معمل الرياضيات">
      <div class="message"><p>جارٍ فتح معمل الرياضيات… إذا لم يظهر، استخدم زر «فتح المعمل مباشرة» أعلى الصفحة.</p></div>
      <iframe title="معمل الرياضيات الافتراضي" src="https://script.google.com/macros/s/AKfycbyDqH4jgiuWpD0om-WUSPr24_Nr9fJGI7w2jOOihfuVRbomCDFCdLKvZ7a7Gs5_xCiN/exec" allow="fullscreen"></iframe>
    </section>
  </main>
  <script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(e=>console.error('تعذر تسجيل عامل الخدمة',e)));</script>
</body>
</html>
